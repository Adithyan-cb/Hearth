<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth</title>
<meta name="theme-color" content="#120d0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hearth">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Hearth</h1>
  <div class="stage">
    <div class="sheet"><div class="paper" id="paper">
      <textarea id="txt" placeholder="What are you carrying?" aria-label="Your thoughts"></textarea>
    </div></div>
    <div class="done" id="done" aria-live="polite">
      <p>Let it go.<br>You are free.</p>
      <button class="btn ghost" id="again">Write another</button>
    </div>
  </div>
  <button class="btn" id="burn" disabled>Burn it</button>
  <div class="foot"><span>Nothing you write is saved or sent anywhere.</span></div>
  <button id="snd" aria-pressed="true" aria-label="Sound on" title="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="script.js"></script>
</body>
</html>
